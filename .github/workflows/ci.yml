name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    name: check (react ${{ matrix.react }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v6
        if: matrix.react == '19' && github.event_name == 'pull_request'
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - name: Install diff coverage tooling
        if: matrix.react == '19' && github.event_name == 'pull_request'
        run: python3 -m pip install diff-cover==10.0.0
      - name: Install React ${{ matrix.react }}
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: |
          bun add --no-save \
            "react@$REACT_MAJOR" \
            "react-dom@$REACT_MAJOR" \
            "@types/react@$REACT_MAJOR" \
            "@types/react-dom@$REACT_MAJOR"
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: Enforce 100% diff coverage
        if: matrix.react == '19' && github.event_name == 'pull_request'
        run: bun run test:diff-coverage -- "${{ github.event.pull_request.base.sha }}"
      - name: Upload coverage to Codecov
        if: matrix.react == '19'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - run: bun run build
      - name: Enforce bundle size ceiling
        run: |
          SIZE=$(wc -c < dist/crrt.es.js | tr -d ' ')
          # Screenshot capture currently bundles html2canvas; keep a modest
          # headroom over the current screenshot-enabled baseline.
          MAX=524288
          echo "dist/crrt.es.js: $SIZE bytes (max $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Bundle exceeds size ceiling"
            exit 1
          fi

  mcp-integration:
    runs-on: ubuntu-latest
    name: MCP OAuth, dashboard parity and permissions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Start isolated local Supabase and apply migrations
        run: bun run local:up
      - name: Exercise real MCP OAuth, RLS, dashboard upgrades and writes
        run: bun run test:mcp:local
      - name: Build and verify packaged MCP function
        run: |
          bun run build:landing
          bun run build:dashboard
          bun scripts/build-vercel-output.ts
          bunx -p node@24 node --env-file=.env.docker.local scripts/verify-mcp-package.mjs
      - name: Stop local services
        if: always()
        run: bunx supabase stop

  drizzle:
    runs-on: ubuntu-latest
    name: drizzle (snapshot consistency)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx drizzle-kit check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm is the one holdout: `bun audit` has no --omit=dev flag, and we gate
      # on advisories in shipped runtime code only — not the dev toolchain
      # (@vercel/node pulls transitive build-tools with open advisories its
      # own latest release hasn't yet dropped; blocking merges on that churn
      # would be dishonest). Everything else in this repo is bun. Dev-tree
      # hygiene is tracked via Dependabot (.github/dependabot.yml).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Pin npm because the version bundled with Node 22 currently crashes in
      # Arborist while resolving this Bun-managed dependency tree.
      - run: npm install --global npm@11.16.0
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: npm audit (runtime only, high + critical)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned by sha256)
        env:
          GITLEAKS_VERSION: '8.28.0'
          GITLEAKS_SHA256: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'
        run: |
          set -euo pipefail
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$URL" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan for committed secrets
        # Scan this checkout's full ancestry, including historical secrets, without
        # pulling unrelated fetched branches into every PR's result.
        run: gitleaks detect --source . --log-opts=HEAD --redact --verbose --exit-code 1
