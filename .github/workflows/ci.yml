name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, build and tests run as parallel jobs; `check (react N)` below
  # keeps the required status names and fails unless every one of them passed.
  typecheck:
    name: typecheck (react ${{ matrix.react }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - name: Start budget clock
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install React ${{ matrix.react }}
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: |
          bun add --no-save \
            "react@$REACT_MAJOR" \
            "react-dom@$REACT_MAJOR" \
            "@types/react@$REACT_MAJOR" \
            "@types/react-dom@$REACT_MAJOR"
      - name: Typecheck
        run: bash scripts/ci-budget.sh 5 typecheck -- bun run typecheck

  # Shards balance files by measured duration (scripts/test-durations.json).
  # Every shard records the full file list and its share; check (react 19)
  # proves the shards covered every file exactly once.
  test:
    name: test (react ${{ matrix.react }}, ${{ matrix.shard }}/${{ matrix.react == '19' && '6' || '4' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # React 19 collects coverage, so it gets more shards to stay well
      # inside the 60s per-shard budget (4 shards measured 58s at p95).
      matrix:
        react: ['18', '19']
        shard: [1, 2, 3, 4, 5, 6]
        exclude:
          - react: '18'
            shard: 5
          - react: '18'
            shard: 6
    steps:
      - name: Start budget clock
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          # PR selection diffs against the base; blobless keeps history cheap.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install React ${{ matrix.react }}
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: |
          bun add --no-save \
            "react@$REACT_MAJOR" \
            "react-dom@$REACT_MAJOR" \
            "@types/react@$REACT_MAJOR" \
            "@types/react-dom@$REACT_MAJOR"
      # Pull requests run only the tests their diff can reach when nothing in
      # the diff is invisible to the module graph (scripts/test-selection.ts);
      # trunk and the merge queue always run everything. Coverage feeds the
      # diff-coverage gate and Codecov, both React 19 only; shards keep raw
      # coverage in blob reports and check (react 19) merges it.
      - name: Test shard
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.react == '19' && '6' || '4' }}
          SELECTION_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE: ${{ matrix.react == '19' }}
          VITEST_SHARD_MANIFEST: .vitest-shards/react${{ matrix.react }}/shard-${{ matrix.shard }}.json
        run: bash scripts/ci-budget.sh 60 "test shard $SHARD" -- bun scripts/run-test-shard.ts "$SHARD"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-react${{ matrix.react }}-shard${{ matrix.shard }}
          path: |
            .vitest-shards/
            .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Start budget clock
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # React is external to the bundle, so one build (with the lockfile's
      # React, as publish.yml does) covers both React majors; typecheck
      # (react 18) covers the widget's React 18 types.
      - run: bun install --frozen-lockfile
      - name: Build
        run: bash scripts/ci-budget.sh 20 build -- bun run build
      - name: Enforce bundle size ceiling
        run: |
          SIZE=$(wc -c < dist/crrt.es.js | tr -d ' ')
          # Screenshot capture currently bundles html2canvas; keep a modest
          # headroom over the current screenshot-enabled baseline.
          MAX=524288
          echo "dist/crrt.es.js: $SIZE bytes (max $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Bundle exceeds size ceiling"
            exit 1
          fi

  # Required status checks are named `check (react 18)` and `check (react 19)`.
  # Both require every typecheck, test and build job to succeed. `always()`
  # (not `!cancelled()`) so a cancelled or skipped dependency reports a
  # failure instead of a skipped, and therefore passing, required check.
  check-react-18:
    name: check (react 18)
    if: always()
    needs: [typecheck, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require typecheck, tests and build to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "typecheck, test, build: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  check-react-19:
    name: check (react 19)
    if: always()
    needs: [typecheck, test, build]
    runs-on: ubuntu-24.04
    env:
      DIFF_COVERAGE: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require typecheck, tests and build to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "typecheck, test, build: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
      - name: Start budget clock
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          # Diff coverage needs the PR base. A blobless clone fetches history
          # without file contents (measured as fast as a shallow clone here).
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        if: env.DIFF_COVERAGE == 'true'
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - name: Install diff coverage tooling
        if: env.DIFF_COVERAGE == 'true'
        run: python3 -m pip install diff-cover==10.0.0
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-react*-shard*
          merge-multiple: true
      - name: Prove every test file ran exactly once
        id: shards
        run: |
          bun scripts/verify-test-shards.ts .vitest-shards/react18
          bun scripts/verify-test-shards.ts .vitest-shards/react19
      - name: Merge shard coverage
        run: bash scripts/ci-budget.sh 15 "coverage merge" -- ./node_modules/.bin/vitest --merge-reports --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      - name: Enforce 100% diff coverage
        if: env.DIFF_COVERAGE == 'true'
        run: bun run test:diff-coverage -- "${{ github.event.pull_request.base.sha }}"
      # A selected run covers only the affected tests; uploading it would
      # report a false project-wide drop. The diff-coverage gate still ran.
      - name: Upload coverage to Codecov
        if: steps.shards.outputs.mode == 'full'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  mcp-integration:
    runs-on: ubuntu-latest
    name: MCP OAuth, dashboard parity and permissions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Start isolated local Supabase and apply migrations
        run: bun run local:up
      - name: Exercise real MCP OAuth, RLS, dashboard upgrades and writes
        run: bun run test:mcp:local
      - name: Build and verify packaged MCP function
        run: |
          bun run build:landing
          bun run build:dashboard
          bun scripts/build-vercel-output.ts
          bunx -p node@24 node --env-file=.env.docker.local scripts/verify-mcp-package.mjs
      - name: Stop local services
        if: always()
        run: bunx supabase stop

  drizzle:
    runs-on: ubuntu-latest
    name: drizzle (snapshot consistency)
    steps:
      - name: Start budget clock
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check migration snapshot consistency
        run: bash scripts/ci-budget.sh 10 "drizzle check" -- bunx drizzle-kit check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm is the one holdout: `bun audit` has no --omit=dev flag, and we gate
      # on advisories in shipped runtime code only — not the dev toolchain
      # (@vercel/node pulls transitive build-tools with open advisories its
      # own latest release hasn't yet dropped; blocking merges on that churn
      # would be dishonest). Everything else in this repo is bun. Dev-tree
      # hygiene is tracked via Dependabot (.github/dependabot.yml).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Pin npm because the version bundled with Node 22 currently crashes in
      # Arborist while resolving this Bun-managed dependency tree.
      - run: npm install --global npm@11.16.0
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: npm audit (runtime only, high + critical)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Start budget clock
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned by sha256)
        env:
          GITLEAKS_VERSION: '8.28.0'
          GITLEAKS_SHA256: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'
        run: |
          set -euo pipefail
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$URL" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan for committed secrets
        # Scan this checkout's full ancestry, including historical secrets, without
        # pulling unrelated fetched branches into every PR's result.
        run: bash scripts/ci-budget.sh 15 "secret scan" -- gitleaks detect --source . --log-opts=HEAD --redact --verbose --exit-code 1
