name: Storybook addon

on:
  pull_request:
    paths:
      - 'packages/crrt-storybook/**'
      - '.github/workflows/storybook-addon-ci.yml'
      - '.github/workflows/publish-storybook-addon.yml'
  push:
    branches: [trunk]
    paths:
      - 'packages/crrt-storybook/**'
      - '.github/workflows/storybook-addon-ci.yml'
      - '.github/workflows/publish-storybook-addon.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/crrt-storybook

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # npm stays only where it is the thing under test: `npm pack` in
      # pack:verify, the consumer install in consumer:verify and publishing.
      - run: npm install --global npm@11.16.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build-storybook
      - run: bun run pack:verify
      - run: bun run consumer:verify
